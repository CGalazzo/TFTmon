name: Hide board cell visuals
on:
  push:
    paths:
      - '.github/workflows/hide-board-cells.yml'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply visual-only cell patch
        run: python .github/scripts/hide_board_cells.py
      - name: Validate visual-only change
        run: |
          grep -q 'TFTMON INVISIBLE BOARD CELLS' index.html
          grep -q 'board.dragging-active .cell.drag-over' index.html
          git diff --exit-code -- . ':!index.html'
      - name: Commit board cell visual change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Hide board cell overlays while preserving hitboxes' || exit 0
          git push
