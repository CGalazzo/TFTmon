name: Fix pre-battle Pokemon size

on:
  push:
    paths:
      - .github/workflows/fix-prebattle-pokemon-size.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore battle size and force larger pre-battle sprites
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_fighter = '#gameApp .fighter{width:11.4%!important;height:33.6%!important;'
          new_fighter = '#gameApp .fighter{width:9.5%!important;height:28%!important;'
          if text.count(old_fighter) != 1:
              raise SystemExit(f'Expected current enlarged fighter rule once, found {text.count(old_fighter)}')
          text = text.replace(old_fighter, new_fighter, 1)

          anchor = '#gameApp .cell.drag-over::before{background:rgba(255,226,91,.14)!important;box-shadow:inset 0 0 0 2px rgba(255,230,112,.82),0 0 12px rgba(255,219,80,.38)!important}\n'
          override = '#gameApp .board .cell .token img{width:86.4%!important;height:86.4%!important;max-width:none!important;max-height:none!important;object-fit:contain!important}\n'
          if override not in text:
              if text.count(anchor) != 1:
                  raise SystemExit(f'Expected arena cell anchor once, found {text.count(anchor)}')
              text = text.replace(anchor, anchor + override, 1)

          required = [
              "width:min(100%,1320px)!important;max-width:1320px!important;aspect-ratio:1100/401!important;",
              '#gameApp .fighter{width:9.5%!important;height:28%!important;',
              '#gameApp .board .cell .token img{width:86.4%!important;height:86.4%!important;',
              '#gameApp .cell:nth-child(1){left:25.2542%!important;top:15.9841%!important;',
              '#gameApp .cell:nth-child(42){left:71.6602%!important;top:63.0119%!important;',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'Missing expected marker after patch: {marker}')

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- index.html

      - name: Commit correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Restore battle Pokemon size and enlarge pre-battle sprites'
          git push origin HEAD:main
