name: Apply approved floating arena

on:
  push:
    paths:
      - '.github/workflows/apply-approved-arena.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch current game with approved arena
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '/* ===== TFTMON EXACT APPROVED FLOATING ARENA — 2026-10-05 ===== */'
          css = base64.b64decode('').decode('utf-8')
          if marker not in text:
              pos = text.find('</style>')
              if pos < 0:
                  raise SystemExit('Could not find </style>')
              text = text[:pos] + css + '\n  ' + text[pos:]

          if 'tftmon-arena-approved-1.b64' not in text:
              old = "      const [bg,logo]=await Promise.all([\n        read(['assets/tftmon-bg-1.b64','assets/tftmon-bg-2.b64','assets/tftmon-bg-3.b64']),\n        read(['assets/tftmon-logo-1.b64','assets/tftmon-logo-2.b64','assets/tftmon-logo-3.b64','assets/tftmon-logo-4.b64','assets/tftmon-logo-5.b64','assets/tftmon-logo-6.b64'])\n      ]);\n      const root=document.documentElement.style,bgUrl='url(\"data:image/webp;base64,'+bg+'\")',logoUrl='url(\"data:image/webp;base64,'+logo+'\")';\n      root.setProperty('--start-bg-image',bgUrl);root.setProperty('--game-bg-image',bgUrl);root.setProperty('--logo-image',logoUrl);"
              new = "      const [bg,logo,arena]=await Promise.all([\n        read(['assets/tftmon-bg-1.b64','assets/tftmon-bg-2.b64','assets/tftmon-bg-3.b64']),\n        read(['assets/tftmon-logo-1.b64','assets/tftmon-logo-2.b64','assets/tftmon-logo-3.b64','assets/tftmon-logo-4.b64','assets/tftmon-logo-5.b64','assets/tftmon-logo-6.b64']),\n        read(['assets/tftmon-arena-approved-1.b64','assets/tftmon-arena-approved-2.b64','assets/tftmon-arena-approved-3.b64','assets/tftmon-arena-approved-4.b64'])\n      ]);\n      const root=document.documentElement.style,bgUrl='url(\"data:image/webp;base64,'+bg+'\")',logoUrl='url(\"data:image/webp;base64,'+logo+'\")',arenaUrl='url(\"data:image/webp;base64,'+arena+'\")';\n      root.setProperty('--start-bg-image',bgUrl);root.setProperty('--game-bg-image',bgUrl);root.setProperty('--logo-image',logoUrl);root.setProperty('--arena-image',arenaUrl);"
              if old not in text:
                  raise SystemExit('Visual loader signature changed')
              text = text.replace(old, new, 1)

          if 'arenaLeftPct' not in text:
              old_move = "d.dataset.fxX=String(c.x);d.dataset.fxY=String(c.y);d.style.left=(ox+c.x*sx)+'px';d.style.top=(oy+c.y*sy)+'px';"
              new_move = "d.dataset.fxX=String(c.x);d.dataset.fxY=String(c.y);\n      const arenaTy=(c.y+.5)/6;\n      const arenaLeftPct=24.2+(11.8-24.2)*arenaTy,arenaRightPct=75.8+(88.2-75.8)*arenaTy;\n      const arenaXPct=arenaLeftPct+(arenaRightPct-arenaLeftPct)*((c.x+.5)/7);\n      const arenaYPct=17.1+(76.4-17.1)*arenaTy;\n      d.style.left=(layer.clientWidth*arenaXPct/100-layer.clientWidth*.056)+'px';\n      d.style.top=(layer.clientHeight*arenaYPct/100-layer.clientHeight*.071)+'px';\n      d.style.setProperty('--arena-depth',(0.80+arenaTy*.27).toFixed(3));"
              if old_move not in text:
                  raise SystemExit('Combat movement signature changed')
              text = text.replace(old_move, new_move, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check

      - name: Commit arena integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply exact approved floating arena and perspective movement' || exit 0
          git push origin HEAD:main
