name: Apply approved floating arena

on:
  push:
    paths:
      - '.github/workflows/apply-approved-arena.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch current game with approved arena
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          marker = '/* ===== TFTMON EXACT APPROVED FLOATING ARENA — 2026-10-05 ===== */'
          css = r'''

    /* ===== TFTMON EXACT APPROVED FLOATING ARENA — 2026-10-05 ===== */
    #gameApp .arena-decor{display:none!important}

    #gameApp .board,
    #gameApp .battle-preview[data-boss] + .board{
      position:relative!important;
      isolation:isolate!important;
      width:min(100%,950px)!important;
      max-width:950px!important;
      aspect-ratio:950/590!important;
      height:auto!important;
      margin:4px auto 26px!important;
      padding:9.7% 10.5% 23.6%!important;
      grid-template-columns:repeat(7,minmax(0,1fr))!important;
      grid-template-rows:repeat(6,minmax(0,1fr))!important;
      gap:0!important;
      overflow:visible!important;
      border:0!important;
      border-radius:0!important;
      background-color:transparent!important;
      background-image:var(--arena-image)!important;
      background-size:100% 100%!important;
      background-position:center!important;
      background-repeat:no-repeat!important;
      box-shadow:none!important;
    }

    #gameApp .board::before,
    #gameApp .board::after{display:none!important}

    #gameApp .cell{
      min-width:0!important;
      min-height:0!important;
      z-index:2!important;
      overflow:visible!important;
      border:0!important;
      background:transparent!important;
      box-shadow:none!important;
      border-radius:7px!important;
      outline:none!important;
    }
    #gameApp .cell::before{
      content:""!important;
      position:absolute!important;
      inset:2px!important;
      z-index:0!important;
      border-radius:7px!important;
      border:1px solid transparent!important;
      background:transparent!important;
      box-shadow:none!important;
      opacity:0!important;
      transition:opacity .14s,border-color .14s,background .14s,box-shadow .14s!important;
    }
    #gameApp .cell::after{display:none!important}
    #gameApp .cell:hover::before{
      opacity:.82!important;
      border-color:currentColor!important;
      background:rgba(255,255,255,.035)!important;
      box-shadow:0 0 8px color-mix(in srgb,currentColor 18%,transparent)!important;
    }
    #gameApp .board.dragging-active .player-zone::before{
      opacity:1!important;
      border-color:#7deaffad!important;
      background:#27d9ff0e!important;
      box-shadow:inset 0 0 12px #29dfff14,0 0 8px #29ddff2b!important;
    }
    #gameApp .board.dragging-active .enemy-zone::before{
      opacity:.12!important;
      border-color:#ff9a7a44!important;
      background:transparent!important;
      box-shadow:none!important;
      filter:none!important;
    }
    #gameApp .cell.drag-over::before{
      opacity:1!important;
      border-color:#ffe36ccf!important;
      background:#ffd84c12!important;
      box-shadow:inset 0 0 15px #ffd84c20,0 0 11px #ffd84c45!important;
    }

    /* The illustration already contains the perspective grid. The interaction grid stays invisible,
       while combat units are projected to calibrated arena coordinates below. */
    #gameApp .battle-layer,
    #gameApp .fx-layer{
      inset:0!important;
      top:0!important;
      right:0!important;
      bottom:0!important;
      left:0!important;
      overflow:visible!important;
      pointer-events:none!important;
    }
    #gameApp .battle-layer{z-index:40!important}
    #gameApp .fx-layer{z-index:25!important}
    #gameApp .fighter{
      width:11.2%!important;
      height:14.2%!important;
      transform-origin:center bottom!important;
      scale:var(--arena-depth,1);
      overflow:visible!important;
    }
    #gameApp .fighter-sprite,
    #gameApp .fighter-sprite img{overflow:visible!important}

    /* Preparation sprites get a light depth cue without changing board logic. */
    #gameApp .cell:nth-child(-n+7) .token{scale:.84;transform-origin:center bottom}
    #gameApp .cell:nth-child(n+8):nth-child(-n+14) .token{scale:.88;transform-origin:center bottom}
    #gameApp .cell:nth-child(n+15):nth-child(-n+21) .token{scale:.92;transform-origin:center bottom}
    #gameApp .cell:nth-child(n+22):nth-child(-n+28) .token{scale:.96;transform-origin:center bottom}
    #gameApp .cell:nth-child(n+29):nth-child(-n+35) .token{scale:1;transform-origin:center bottom}
    #gameApp .cell:nth-child(n+36):nth-child(-n+42) .token{scale:1.04;transform-origin:center bottom}

    @media(max-width:820px){
      #gameApp .board,
      #gameApp .battle-preview[data-boss] + .board{
        width:min(calc(100vw - 6px),950px)!important;
        max-width:calc(100vw - 6px)!important;
        aspect-ratio:950/590!important;
        margin:2px auto 22px!important;
        padding:9.7% 10.5% 23.6%!important;
      }
      #gameApp .fighter{width:11.8%!important;height:14.8%!important}
      #gameApp .cell::before{inset:1px!important;border-radius:5px!important}
    }
'''

          # Replace this exact arena override if re-run; otherwise append before </style>.
          start = text.find(marker)
          if start != -1:
              end = text.find('</style>', start)
              if end == -1:
                  raise SystemExit('Could not locate </style> after arena marker')
              text = text[:start] + css.lstrip('\n') + text[end:]
          else:
              idx = text.find('</style>')
              if idx == -1:
                  raise SystemExit('Could not locate </style>')
              text = text[:idx] + css + '\n  ' + text[idx:]

          # Load the exact approved arena artwork already stored in repository chunks.
          if "tftmon-arena-approved-1.b64" not in text:
              old = """      const [bg,logo]=await Promise.all([\n        read(['assets/tftmon-bg-1.b64','assets/tftmon-bg-2.b64','assets/tftmon-bg-3.b64']),\n        read(['assets/tftmon-logo-1.b64','assets/tftmon-logo-2.b64','assets/tftmon-logo-3.b64','assets/tftmon-logo-4.b64','assets/tftmon-logo-5.b64','assets/tftmon-logo-6.b64'])\n      ]);\n      const root=document.documentElement.style,bgUrl='url(\"data:image/webp;base64,'+bg+'\")',logoUrl='url(\"data:image/webp;base64,'+logo+'\")';\n      root.setProperty('--start-bg-image',bgUrl);root.setProperty('--game-bg-image',bgUrl);root.setProperty('--logo-image',logoUrl);"""
              new = """      const [bg,logo,arena]=await Promise.all([\n        read(['assets/tftmon-bg-1.b64','assets/tftmon-bg-2.b64','assets/tftmon-bg-3.b64']),\n        read(['assets/tftmon-logo-1.b64','assets/tftmon-logo-2.b64','assets/tftmon-logo-3.b64','assets/tftmon-logo-4.b64','assets/tftmon-logo-5.b64','assets/tftmon-logo-6.b64']),\n        read(['assets/tftmon-arena-approved-1.b64','assets/tftmon-arena-approved-2.b64','assets/tftmon-arena-approved-3.b64','assets/tftmon-arena-approved-4.b64'])\n      ]);\n      const root=document.documentElement.style,bgUrl='url(\"data:image/webp;base64,'+bg+'\")',logoUrl='url(\"data:image/webp;base64,'+logo+'\")',arenaUrl='url(\"data:image/webp;base64,'+arena+'\")';\n      root.setProperty('--start-bg-image',bgUrl);root.setProperty('--game-bg-image',bgUrl);root.setProperty('--logo-image',logoUrl);root.setProperty('--arena-image',arenaUrl);"""
              if old not in text:
                  raise SystemExit('Visual asset loader signature changed; refusing unsafe patch')
              text = text.replace(old, new, 1)

          # Project combat movement onto the trapezoidal grid in the approved illustration.
          old_move = "d.dataset.fxX=String(c.x);d.dataset.fxY=String(c.y);d.style.left=(ox+c.x*sx)+'px';d.style.top=(oy+c.y*sy)+'px';"
          if 'arenaLeftPct' not in text:
              new_move = """d.dataset.fxX=String(c.x);d.dataset.fxY=String(c.y);\n      const arenaTy=(c.y+.5)/6;\n      const arenaLeftPct=24.2+(11.8-24.2)*arenaTy,arenaRightPct=75.8+(88.2-75.8)*arenaTy;\n      const arenaXPct=arenaLeftPct+(arenaRightPct-arenaLeftPct)*((c.x+.5)/7);\n      const arenaYPct=17.1+(76.4-17.1)*arenaTy;\n      d.style.left=(layer.clientWidth*arenaXPct/100-layer.clientWidth*.056)+'px';\n      d.style.top=(layer.clientHeight*arenaYPct/100-layer.clientHeight*.071)+'px';\n      d.style.setProperty('--arena-depth',(0.80+arenaTy*.27).toFixed(3));"""
              if old_move not in text:
                  raise SystemExit('Combat movement signature changed; refusing unsafe patch')
              text = text.replace(old_move, new_move, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check

      - name: Commit arena integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply exact approved floating arena and perspective movement' || exit 0
          git push origin HEAD:main
