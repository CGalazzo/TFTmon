name: Fix approved arena static asset

on:
  push:
    paths:
      - '.github/workflows/fix-arena-static-asset.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build arena image and remove runtime dependency
        shell: bash
        run: |
          set -euo pipefail

          cat \
            assets/tftmon-arena-approved-1.b64 \
            assets/tftmon-arena-approved-2.b64 \
            assets/tftmon-arena-approved-3.b64 \
            assets/tftmon-arena-approved-4.b64 \
            | tr -d '\n\r ' \
            | base64 -d > assets/tftmon-arena-approved.webp

          python3 - <<'PY'
          from pathlib import Path

          image = Path('assets/tftmon-arena-approved.webp')
          raw = image.read_bytes()
          if len(raw) < 1000:
              raise SystemExit('Arena image decode produced an unexpectedly small file')
          if raw[:4] != b'RIFF' or raw[8:12] != b'WEBP':
              raise SystemExit('Decoded approved arena is not a valid WEBP container')

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_css = "background-image:var(--arena-image)!important;"
          new_css = "background-image:url('assets/tftmon-arena-approved.webp')!important;"
          if old_css not in text:
              raise SystemExit('Approved arena CSS signature changed; refusing unsafe patch')
          text = text.replace(old_css, new_css, 1)

          old_loader = """      const [bg,logo,arena]=await Promise.all([\n        read(['assets/tftmon-bg-1.b64','assets/tftmon-bg-2.b64','assets/tftmon-bg-3.b64']),\n        read(['assets/tftmon-logo-1.b64','assets/tftmon-logo-2.b64','assets/tftmon-logo-3.b64','assets/tftmon-logo-4.b64','assets/tftmon-logo-5.b64','assets/tftmon-logo-6.b64']),\n        read(['assets/tftmon-arena-approved-1.b64','assets/tftmon-arena-approved-2.b64','assets/tftmon-arena-approved-3.b64','assets/tftmon-arena-approved-4.b64'])\n      ]);\n      const root=document.documentElement.style,bgUrl='url(\"data:image/webp;base64,'+bg+'\")',logoUrl='url(\"data:image/webp;base64,'+logo+'\")',arenaUrl='url(\"data:image/webp;base64,'+arena+'\")';\n      root.setProperty('--start-bg-image',bgUrl);root.setProperty('--game-bg-image',bgUrl);root.setProperty('--logo-image',logoUrl);root.setProperty('--arena-image',arenaUrl);"""
          new_loader = """      const [bg,logo]=await Promise.all([\n        read(['assets/tftmon-bg-1.b64','assets/tftmon-bg-2.b64','assets/tftmon-bg-3.b64']),\n        read(['assets/tftmon-logo-1.b64','assets/tftmon-logo-2.b64','assets/tftmon-logo-3.b64','assets/tftmon-logo-4.b64','assets/tftmon-logo-5.b64','assets/tftmon-logo-6.b64'])\n      ]);\n      const root=document.documentElement.style,bgUrl='url(\"data:image/webp;base64,'+bg+'\")',logoUrl='url(\"data:image/webp;base64,'+logo+'\")';\n      root.setProperty('--start-bg-image',bgUrl);root.setProperty('--game-bg-image',bgUrl);root.setProperty('--logo-image',logoUrl);"""
          if old_loader not in text:
              raise SystemExit('Visual asset loader signature changed; refusing unsafe patch')
          text = text.replace(old_loader, new_loader, 1)

          path.write_text(text, encoding='utf-8')
          print('approved arena bytes:', len(raw))
          PY

          git diff --check

      - name: Commit arena reliability fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/tftmon-arena-approved.webp
          git commit -m 'Fix approved arena loading with static asset' || exit 0
          git push origin HEAD:main
