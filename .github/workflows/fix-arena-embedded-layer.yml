name: Fix arena with embedded image layer

on:
  push:
    paths:
      - '.github/workflows/fix-arena-embedded-layer.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Embed approved arena as board image layer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          parts = []
          for i in range(1, 5):
              parts.append(Path(f'assets/tftmon-arena-approved-{i}.b64').read_text(encoding='utf-8'))
          arena_b64 = ''.join(parts).replace('\n','').replace('\r','').replace(' ','')
          if len(arena_b64) < 10000:
              raise SystemExit('Approved arena base64 is unexpectedly short')
          arena_data = 'data:image/webp;base64,' + arena_b64

          # 1) Add a hard embedded arena constant. This removes any dependency on CSS variables,
          # runtime fetches, separate binary assets or browser path resolution.
          anchor = "  const COMBAT_FX_ENABLED = true; // visual-only layer; set false to disable movement/VFX without changing combat logic\n"
          const_line = "  const APPROVED_ARENA_IMAGE = '" + arena_data + "';\n"
          if 'const APPROVED_ARENA_IMAGE =' not in text:
              if anchor not in text:
                  raise SystemExit('Combat constants anchor changed; refusing unsafe patch')
              text = text.replace(anchor, anchor + const_line, 1)

          # 2) The board itself no longer owns the image. An actual IMG element will sit behind cells.
          text = text.replace("      background-image:url('assets/tftmon-arena-approved.webp')!important;",
                              "      background-image:none!important;", 1)
          text = text.replace("      background-image:var(--arena-image)!important;",
                              "      background-image:none!important;", 1)

          # 3) Add robust image-layer CSS immediately before board pseudo-element reset.
          css_anchor = "    #gameApp .board::before,\n    #gameApp .board::after{display:none!important}\n"
          layer_css = """    #gameApp .arena-approved-bg{\n      position:absolute!important;\n      inset:0!important;\n      width:100%!important;\n      height:100%!important;\n      display:block!important;\n      object-fit:fill!important;\n      object-position:center!important;\n      pointer-events:none!important;\n      user-select:none!important;\n      z-index:0!important;\n      opacity:1!important;\n      visibility:visible!important;\n      filter:none!important;\n      transform:none!important;\n    }\n\n"""
          if '.arena-approved-bg{' not in text:
              if css_anchor not in text:
                  raise SystemExit('Board pseudo-element CSS anchor changed; refusing unsafe patch')
              text = text.replace(css_anchor, layer_css + css_anchor, 1)

          # 4) Create the image after each board render, before the 42 cells.
          render_anchor = "  function renderBoard(){\n    els.board.classList.toggle('in-battle',!!state.battle);els.board.innerHTML='';\n"
          render_new = """  function renderBoard(){\n    els.board.classList.toggle('in-battle',!!state.battle);els.board.innerHTML='';\n    const arenaBg=document.createElement('img');arenaBg.className='arena-approved-bg';arenaBg.src=APPROVED_ARENA_IMAGE;arenaBg.alt='';arenaBg.setAttribute('aria-hidden','true');els.board.appendChild(arenaBg);\n"""
          if "arenaBg.className='arena-approved-bg'" not in text:
              if render_anchor not in text:
                  raise SystemExit('renderBoard anchor changed; refusing unsafe patch')
              text = text.replace(render_anchor, render_new, 1)

          # 5) Make sure cells and combat layers stay above the arena layer.
          text = text.replace("      z-index:2!important;\n      overflow:visible!important;\n      border:0!important;",
                              "      z-index:2!important;\n      overflow:visible!important;\n      border:0!important;", 1)

          path.write_text(text, encoding='utf-8')
          print('Embedded approved arena chars:', len(arena_b64))
          PY

          git diff --check

      - name: Commit embedded arena fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix invisible arena with embedded board image layer' || exit 0
          git push origin HEAD:main
