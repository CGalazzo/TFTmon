name: Apply remaining item sprites

on:
  push:
    paths:
      - '.github/workflows/apply-remaining-item-sprites.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add remaining combined item sprite mappings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "const ITEM_SPRITES={claw:'assets/items/claw.png',feather:'assets/items/feather.png',crystal:'assets/items/crystal.png',shell:'assets/items/shell.png',seed:'assets/items/seed.png',muscle:'assets/items/muscle.png',scarf:'assets/items/scarf.png',glasses:'assets/items/glasses.png',metal:'assets/items/metal.png',leftovers:'assets/items/leftovers.png',quickClaw:'assets/items/quick-claw.png',orb:'assets/items/orb.png',combatBand:'assets/items/combat-band.png'};"
          new = "const ITEM_SPRITES={claw:'assets/items/claw.png',feather:'assets/items/feather.png',crystal:'assets/items/crystal.png',shell:'assets/items/shell.png',seed:'assets/items/seed.png',muscle:'assets/items/muscle.png',scarf:'assets/items/scarf.png',glasses:'assets/items/glasses.png',metal:'assets/items/metal.png',leftovers:'assets/items/leftovers.png',quickClaw:'assets/items/quick-claw.png',orb:'assets/items/orb.png',combatBand:'assets/items/combat-band.png',fang:'assets/items/fang.png',amulet:'assets/items/amulet.png',cloak:'assets/items/cloak.png',vigor:'assets/items/vigor.png',barrier:'assets/items/barrier.png',bell:'assets/items/bell.png',vest:'assets/items/vest.png'};"
          if old not in s:
              raise SystemExit('ITEM_SPRITES mapping not found exactly; refusing to modify anything else')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- index.html
      - name: Commit mapping only
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Map remaining combined item sprites'
          git push origin HEAD:main
