name: Apply automatic merge fix
on:
  push:
    paths: ['.github/workflows/auto-merge-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('function tryMerge(line,stage){','function tryMerge(line,stage,extraUnit=null){',1)
          s=s.replace('const copies=allPlayerUnits().filter(u=>u.line===line&&u.stage===stage);','const copies=allPlayerUnits().filter(u=>u.line===line&&u.stage===stage);if(extraUnit)copies.push(extraUnit);',1)
          s=s.replace('const picked=copies.slice(0,3).map(u=>removeById(u.id));',"const picked=copies.slice(0,3).map(u=>u===extraUnit?{u,location:'purchase',index:-1}:removeById(u.id));",1)
          s=s.replace("const open=state.bench.findIndex(x=>!x);if(open<0){toast('Banco cheio. Libere um espaço para comprar.');return}","const open=state.bench.findIndex(x=>!x),canMergeWithoutBench=open<0&&offer.stage<LINES[offer.line].stages.length-1&&countCopies(offer.line,offer.stage)>=2;if(open<0&&!canMergeWithoutBench){toast('Banco cheio. Libere um espaço para comprar.');return}",1)
          s=s.replace('state.gold-=cost;const u=unit(offer.line,offer.stage);state.bench[open]=u;','state.gold-=cost;const u=unit(offer.line,offer.stage);if(open>=0)state.bench[open]=u;',1)
          s=s.replace('state.shop[i]=null;normalizeShop();tryMerge(offer.line,offer.stage);render();','state.shop[i]=null;normalizeShop();tryMerge(offer.line,offer.stage,open>=0?null:u);render();',1)
          p.write_text(s)
          PY
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Fix automatic evolution across field and bench purchases
          file_pattern: index.html
