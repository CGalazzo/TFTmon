name: Apply selected panel redesign
on:
  push:
    paths:
      - '.github/workflows/apply-selected-panel-redesign.yml'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply selected panel patch
        run: python .github/scripts/redesign_selected_panel.py
      - name: Validate selected panel only
        run: |
          grep -q 'TFTMON SELECTED PANEL REDESIGN' index.html
          grep -q 'selected-equipment-slots' index.html
          git diff --exit-code -- . ':!index.html' ':!.github/scripts/redesign_selected_panel.py' ':!.github/workflows/apply-selected-panel-redesign.yml'
      - name: Commit selected panel redesign
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Redesign selected Pokemon panel' || exit 0
          git push
