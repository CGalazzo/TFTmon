name: Expand TFTmon progression
on:
  push:
    paths:
      - '.github/workflows/expand-50-rounds.yml'
      - '.github/scripts/expand_50_rounds.py'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply progression patch
        run: python3 .github/scripts/expand_50_rounds.py
      - name: Commit progression update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Expand progression to 50 rounds with late-game bosses
          file_pattern: index.html
