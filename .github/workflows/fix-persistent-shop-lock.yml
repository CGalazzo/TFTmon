name: Fix persistent shop lock
on:
  push:
    paths:
      - '.github/workflows/fix-persistent-shop-lock.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted patch
        run: python .github/scripts/fix-persistent-shop-lock.py
      - name: Validate syntax and lock rule
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',html,re.I)
          Path('/tmp/tftmon.js').write_text('\n'.join(scripts),encoding='utf-8')
          assert 'if(free&&state.shopLocked){render();return}' in html
          assert 'if(free&&state.shopLocked&&state.shop.length){render();return}' not in html
          PY
          node --check /tmp/tftmon.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Keep shop locked across rounds"
          git push
