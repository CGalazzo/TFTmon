name: Apply no third-stage random appearances

on:
  push:
    paths:
      - '.github/workflows/apply-no-third-stage-shop.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch stage odds and enemy balance
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "    if(round<=5)return {count:round===4?2:3,scale:round===4?.86:.92,stage1:.05,stage2:0,synergy:0};": "    if(round<=5)return {count:round===4?2:3,scale:round===4?.86:.92,stage1:0,stage2:0,synergy:0};",
              "    if(round<=11)return {count:4,scale:1.00,stage1:.25,stage2:.03,synergy:3};": "    if(round<=11)return {count:4,scale:1.00,stage1:.28,stage2:0,synergy:3};",
              "    if(round<=14)return {count:5,scale:1.06,stage1:.38,stage2:.06,synergy:3};": "    if(round<=14)return {count:5,scale:1.06,stage1:.44,stage2:0,synergy:3};",
              "    if(round<=17)return {count:5,scale:1.11,stage1:.50,stage2:.12,synergy:5};": "    if(round<=17)return {count:5,scale:1.11,stage1:.62,stage2:0,synergy:5};",
              "    if(round<=21)return {count:6,scale:1.16,stage1:.58,stage2:.18,synergy:5};": "    if(round<=21)return {count:6,scale:1.16,stage1:.76,stage2:0,synergy:5};",
              "    return {count:7,scale:1.23,stage1:.64,stage2:.24,synergy:5};": "    return {count:7,scale:1.23,stage1:.88,stage2:0,synergy:5};",
              "      if(level<=6)return [94,5,1];": "      if(level<=6)return [94,6,0];",
              "      if(level===7)return [82,15,3];": "      if(level===7)return [82,18,0];",
              "      if(level===8)return [72,21,7];": "      if(level===8)return [72,28,0];",
              "      return [62,26,12];": "      return [62,38,0];",
              "    if(level===5)return [82,16,2];": "    if(level===5)return [82,18,0];",
              "    if(level===6)return [70,25,5];": "    if(level===6)return [70,30,0];",
              "    if(level===7)return [58,32,10];": "    if(level===7)return [58,42,0];",
              "    if(level===8)return [48,35,17];": "    if(level===8)return [48,52,0];",
              "    return [40,37,23];": "    return [40,60,0];",
              "    let desired=r<o[0]?0:r<o[0]+o[1]?1:2;": "    const desired=r<o[0]?0:1;",
              "    if(l.stages.length===2&&desired>0)return 1;": "",
              "    return Math.min(desired,l.stages.length-1);": "    return Math.min(desired,l.stages.length-1,1);",
              "    if(max>=2&&r<profile.stage2)return 2;": "",
              "    if(max>=1&&r<profile.stage2+profile.stage1)return 1;": "    if(max>=1&&r<profile.stage1)return 1;",
              "    const stages=LINES[line].types;for(let i=0;i<stages.length;i++)if(stages[i].includes(type))return i;return 0;": "    const stages=LINES[line].types;for(let i=0;i<Math.min(2,stages.length);i++)if(stages[i].includes(type))return i;return 0;",
              "      const pool=ENEMY_TRAIT_POOLS[traitType],baseReady=pool.filter(k=>LINES[k].types[0].includes(traitType)),later=pool.filter(k=>!LINES[k].types[0].includes(traitType));": "      const pool=ENEMY_TRAIT_POOLS[traitType],baseReady=pool.filter(k=>LINES[k].types[0].includes(traitType)),later=pool.filter(k=>!LINES[k].types[0].includes(traitType)&&(LINES[k].types[1]||[]).includes(traitType));",
              "    $('#typeModalCount').textContent=list.length+' formas dessa tipagem podem aparecer na loja conforme seu nível e as chances de evolução.';": "    $('#typeModalCount').textContent=list.length+' formas dessa tipagem existem. Na loja aparecem apenas a forma base e o 2º estágio; a forma final é exclusiva de evolução.';",
              "    $('#shopInfoContent').innerHTML='<table class=\"shop-table\"><thead><tr><th>Nível</th><th>1$</th><th>2$</th><th>3$</th><th>4★</th><th>Normal B/2ª/F</th><th>4★ B/2ª/F</th></tr></thead><tbody>'+rows.join('')+'</tbody></table><p class=\"item-note\">Formas evoluídas normais custam o valor equivalente ao estágio. Especiais 4★ custam 4 / 9 / 16 ouro.</p>';": "    $('#shopInfoContent').innerHTML='<table class=\"shop-table\"><thead><tr><th>Nível</th><th>1$</th><th>2$</th><th>3$</th><th>4★</th><th>Normal B/2ª/3ª</th><th>4★ B/2ª/3ª</th></tr></thead><tbody>'+rows.join('')+'</tbody></table><p class=\"item-note\"><b>3º estágio não aparece na loja.</b> Ele só pode ser obtido evoluindo 3 cópias do 2º estágio. As chances removidas do 3º estágio foram transferidas para o 2º estágio.</p>';"
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:80]}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 /tmp/patch.py
          git diff --check

      - name: Commit stage balance changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Remove random third-stage Pokemon and rebalance odds' || exit 0
          git push origin HEAD:main
