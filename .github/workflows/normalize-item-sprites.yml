name: Apply normalized item sprites

on:
  push:
    paths:
      - '.github/workflows/normalize-item-sprites.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow for validation
        run: python3 -m pip install --quiet pillow

      - name: Decode exact corrected sprite files
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\n\r ' < .sprite-staging/fang.b64 | base64 -d > assets/items/fang.png
          tr -d '\n\r ' < .sprite-staging/amulet.b64 | base64 -d > assets/items/amulet.png
          tr -d '\n\r ' < .sprite-staging/cloak.b64 | base64 -d > assets/items/cloak.png
          tr -d '\n\r ' < .sprite-staging/vigor.b64 | base64 -d > assets/items/vigor.png
          cat .sprite-staging/barrier.*.b64 | tr -d '\n\r ' | base64 -d > assets/items/barrier.png
          tr -d '\n\r ' < .sprite-staging/bell.b64 | base64 -d > assets/items/bell.png
          tr -d '\n\r ' < .sprite-staging/vest.b64 | base64 -d > assets/items/vest.png

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib

          expected = {
              'fang.png': ('f653d13e98a0ca3e00d3c188f32a90b43220fcd7593c71fe6279c83b0224a448', 8601),
              'amulet.png': ('e7ac351855e977c4df75466bba6671fbcdcc232241a4311d95ab497500842505', 9356),
              'cloak.png': ('ddb9f5b1d59df31cbd4b133c8e83091d89fc99bc8d5cf264a00fd515ac93fd91', 9091),
              'vigor.png': ('f88fa0c594b50ea03e52a1b7c02237ed464ad5b65fd5421951311035e2ff4daa', 9264),
              'barrier.png': ('19c1f61921aea473d02cfd329f684b0cb7152ae0ad195a027fa8aa86079a7014', 9928),
              'bell.png': ('c6f947d9c91f89a4b73ca94f67e123933dbbe03129e976cfe295af60b71193f0', 8591),
              'vest.png': ('2e730aa23e5622540a48970177bf0cad64a28c58a7ace9efe782fe16f320614a', 10294),
          }
          for name, (sha, size) in expected.items():
              p = Path('assets/items') / name
              raw = p.read_bytes()
              if len(raw) != size:
                  raise SystemExit(f'{name}: tamanho de arquivo incorreto {len(raw)} != {size}')
              got = hashlib.sha256(raw).hexdigest()
              if got != sha:
                  raise SystemExit(f'{name}: checksum incorreto')
              im = Image.open(p)
              im.load()
              if im.size != (139, 120):
                  raise SystemExit(f'{name}: dimensoes incorretas {im.size}')
              print(name, im.size, im.mode, len(raw), got)
          PY

          git diff --check

      - name: Commit only the seven corrected PNGs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/items/fang.png assets/items/amulet.png assets/items/cloak.png assets/items/vigor.png assets/items/barrier.png assets/items/bell.png assets/items/vest.png
          git commit -m 'Normalize remaining combined item sprites' || exit 0
          git push origin HEAD:main
