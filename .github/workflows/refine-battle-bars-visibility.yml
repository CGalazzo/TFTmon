name: Refine battle bars visibility

on:
  push:
    paths:
      - .github/workflows/refine-battle-bars-visibility.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add final battle-bar visibility styling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '/* ===== TFTMON BALANCED BATTLE BAR VISIBILITY ===== */'
          if marker not in text:
              pos = text.rfind('</style>')
              if pos < 0:
                  raise SystemExit('No closing style tag found')
              css = '''\n    /* ===== TFTMON BALANCED BATTLE BAR VISIBILITY ===== */\n    /* Battle only: still compact, but easier to read at a glance. */\n    #gameApp .board.in-battle .fighter .hp{\n      top:auto!important;\n      bottom:-3px!important;\n      width:66%!important;\n      height:4px!important;\n      border:1px solid rgba(0,0,0,.34)!important;\n      background:rgba(38,11,11,.46)!important;\n      box-shadow:0 1px 2px rgba(0,0,0,.28)!important;\n      opacity:.88!important;\n    }\n    #gameApp .board.in-battle .fighter .hp i{\n      opacity:.95!important;\n      box-shadow:0 0 3px rgba(104,223,143,.24)!important;\n    }\n    #gameApp .board.in-battle .fighter .mana{\n      top:auto!important;\n      bottom:-8px!important;\n      width:52%!important;\n      height:3px!important;\n      border:0!important;\n      background:rgba(8,26,45,.42)!important;\n      box-shadow:0 1px 2px rgba(0,0,0,.20)!important;\n      opacity:.84!important;\n    }\n    #gameApp .board.in-battle .fighter .mana i{\n      opacity:.94!important;\n      box-shadow:0 0 3px rgba(91,183,255,.22)!important;\n    }\n    @media(max-width:820px){\n      #gameApp .board.in-battle .fighter .hp{\n        bottom:-3px!important;\n        width:68%!important;\n        height:4px!important;\n      }\n      #gameApp .board.in-battle .fighter .mana{\n        bottom:-8px!important;\n        width:54%!important;\n        height:3px!important;\n      }\n    }\n'''
              text = text[:pos] + css + text[pos:]
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit balanced visibility
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Increase battle bar visibility without clutter'
          git push origin HEAD:main
