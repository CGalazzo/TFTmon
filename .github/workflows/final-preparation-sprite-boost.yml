name: Final preparation sprite boost

on:
  push:
    paths:
      - .github/workflows/final-preparation-sprite-boost.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append final preparation-only overrides
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '/* ===== TFTMON FINAL PREPARATION BOOST ===== */'
          if marker in text:
              raise SystemExit('Final preparation boost already present')
          if text.count('</style>') != 1:
              raise SystemExit(f'Expected one closing style tag, found {text.count("</style>")}')
          css = '''\n    /* ===== TFTMON FINAL PREPARATION BOOST ===== */\n    @media (min-width:1051px){\n      #gameApp .layout{grid-template-columns:150px minmax(0,1fr) 160px!important;gap:8px!important}\n      #gameApp .layout:has(.board.in-battle){grid-template-columns:180px minmax(0,1fr) 190px!important;gap:10px!important}\n      #gameApp .board:not(.in-battle){width:min(100%,1480px)!important;max-width:1480px!important}\n    }\n    #gameApp .board:not(.in-battle) .cell .token img{\n      width:120%!important;\n      height:112%!important;\n      max-width:none!important;\n      max-height:none!important;\n      object-fit:contain!important;\n      object-position:center bottom!important;\n      transform-origin:50% 86%!important;\n      transform:translateY(-9px) scale(var(--sprite-scale,1.18)) scale(1.35)!important;\n      filter:drop-shadow(0 8px 5px #000b)!important;\n    }\n'''
          text = text.replace('</style>', css + '  </style>', 1)
          required = [
              marker,
              '#gameApp .board:not(.in-battle){width:min(100%,1480px)!important;max-width:1480px!important}',
              '#gameApp .board:not(.in-battle) .cell .token img{',
              'scale(var(--sprite-scale,1.18)) scale(1.35)!important',
              '#gameApp .layout:has(.board.in-battle){grid-template-columns:180px minmax(0,1fr) 190px!important;gap:10px!important}',
          ]
          for item in required:
              if item not in text:
                  raise SystemExit(f'Missing required final result: {item}')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- index.html

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix preparation Pokemon size at final CSS cascade'
          git push origin HEAD:main
