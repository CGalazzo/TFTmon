name: Fix synergy card fit

on:
  push:
    paths:
      - '.github/workflows/fix-synergy-card-fit.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add preparation-only synergy fit styling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '/* ===== TFTMON COMPACT PREPARATION SYNERGY CARDS ===== */'
          if marker not in text:
              pos = text.rfind('</style>')
              if pos < 0:
                  raise SystemExit('No closing style tag found')
              css = '''\n    /* ===== TFTMON COMPACT PREPARATION SYNERGY CARDS ===== */\n    /* Only the narrow desktop preparation sidebar: keep all synergy text readable without changing arena/layout widths. */\n    @media (min-width:1051px){\n      #gameApp .layout:not(:has(.board.in-battle)) .side-left{\n        padding-left:8px!important;\n        padding-right:8px!important;\n      }\n      #gameApp .layout:not(:has(.board.in-battle)) .side-left .synergy{\n        grid-template-columns:36px minmax(0,1fr)!important;\n        gap:6px!important;\n        min-height:56px!important;\n        padding:6px 7px!important;\n      }\n      #gameApp .layout:not(:has(.board.in-battle)) .side-left .synergy-iconbox{\n        width:36px!important;\n        height:36px!important;\n        padding:2px!important;\n      }\n      #gameApp .layout:not(:has(.board.in-battle)) .side-left .synergy-icon{\n        width:100%!important;\n        height:100%!important;\n      }\n      #gameApp .layout:not(:has(.board.in-battle)) .side-left .synergy-copy{\n        min-width:0!important;\n        width:100%!important;\n        overflow:visible!important;\n      }\n      #gameApp .layout:not(:has(.board.in-battle)) .side-left .synergy-copy b{\n        font-size:12px!important;\n        line-height:1.05!important;\n        white-space:nowrap!important;\n      }\n      #gameApp .layout:not(:has(.board.in-battle)) .side-left .synergy-copy small{\n        font-size:8px!important;\n        line-height:1.05!important;\n        letter-spacing:-.12px!important;\n        white-space:nowrap!important;\n      }\n      #gameApp .layout:not(:has(.board.in-battle)) .side-left .synergy-next{\n        font-size:11px!important;\n        line-height:1!important;\n        white-space:nowrap!important;\n      }\n      #gameApp .layout:not(:has(.board.in-battle)) .side-left .synergy-count{\n        position:absolute!important;\n        top:4px!important;\n        right:5px!important;\n        width:auto!important;\n        min-width:14px!important;\n        height:14px!important;\n        display:grid!important;\n        place-items:center!important;\n        padding:0 3px!important;\n        border-radius:7px!important;\n        font-size:9px!important;\n        line-height:14px!important;\n        opacity:.82!important;\n        pointer-events:none!important;\n      }\n    }\n'''
              text = text[:pos] + css + text[pos:]
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Commit synergy fit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fit synergy text in narrow preparation sidebar'
          git push origin HEAD:main
