name: Refine battle bars

on:
  push:
    paths:
      - .github/workflows/refine-battle-bars.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add final battle-bar styling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '/* ===== TFTMON SMALL TRANSLUCENT BATTLE BARS ===== */'
          if marker not in text:
              pos = text.rfind('</style>')
              if pos < 0:
                  raise SystemExit('No closing style tag found')
              css = '''\n    /* ===== TFTMON SMALL TRANSLUCENT BATTLE BARS ===== */\n    /* Battle only: keep status readable without covering the Pokémon. */\n    #gameApp .board.in-battle .fighter .hp{\n      top:auto!important;\n      bottom:-2px!important;\n      width:62%!important;\n      height:3px!important;\n      border:1px solid rgba(0,0,0,.22)!important;\n      background:rgba(38,11,11,.28)!important;\n      box-shadow:none!important;\n      opacity:.72!important;\n    }\n    #gameApp .board.in-battle .fighter .hp i{\n      opacity:.82!important;\n      box-shadow:none!important;\n    }\n    #gameApp .board.in-battle .fighter .mana{\n      top:auto!important;\n      bottom:-6px!important;\n      width:48%!important;\n      height:2px!important;\n      border:0!important;\n      background:rgba(8,26,45,.26)!important;\n      box-shadow:none!important;\n      opacity:.68!important;\n    }\n    #gameApp .board.in-battle .fighter .mana i{\n      opacity:.80!important;\n      box-shadow:none!important;\n    }\n    @media(max-width:820px){\n      #gameApp .board.in-battle .fighter .hp{\n        bottom:-2px!important;\n        width:66%!important;\n        height:3px!important;\n      }\n      #gameApp .board.in-battle .fighter .mana{\n        bottom:-6px!important;\n        width:52%!important;\n        height:2px!important;\n      }\n    }\n'''
              text = text[:pos] + css + text[pos:]
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit battle bar refinement
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Shrink and soften battle health and mana bars'
          git push origin HEAD:main
