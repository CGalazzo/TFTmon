name: Restore complete approved arena

on:
  push:
    paths:
      - '.github/workflows/restore-complete-approved-arena.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and validate complete approved arena
        shell: bash
        run: |
          set -euo pipefail

          cat \
            assets/tftmon-arena-1.b64 \
            assets/tftmon-arena-2.b64 \
            assets/tftmon-arena-3.b64 \
            assets/tftmon-arena-4.b64 \
            assets/tftmon-arena-5.b64 \
            assets/tftmon-arena-6.b64 \
            | tr -d '\n\r ' \
            | base64 -d > assets/tftmon-arena-live.webp

          python3 - <<'PY'
          from pathlib import Path
          import re, struct

          image = Path('assets/tftmon-arena-live.webp')
          raw = image.read_bytes()
          if raw[:4] != b'RIFF' or raw[8:12] != b'WEBP':
              raise SystemExit('Arena is not a valid WEBP RIFF container')
          declared = struct.unpack('<I', raw[4:8])[0] + 8
          if len(raw) != declared:
              raise SystemExit(f'Arena is truncated: actual={len(raw)} declared={declared}')
          sig = raw.find(b'\x9d\x01\x2a')
          if sig < 0 or sig + 7 > len(raw):
              raise SystemExit('Could not read VP8 dimensions')
          width = struct.unpack('<H', raw[sig+3:sig+5])[0] & 0x3fff
          height = struct.unpack('<H', raw[sig+5:sig+7])[0] & 0x3fff
          if (width, height) != (950, 590):
              raise SystemExit(f'Unexpected arena dimensions: {width}x{height}')
          print(f'VALID ARENA: {len(raw)} bytes, {width}x{height}')

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # Remove the broken truncated data URI introduced by the previous attempt.
          text, n_const = re.subn(
              r"\n  const APPROVED_ARENA_IMAGE = 'data:image/webp;base64,[^']*';",
              '', text, count=1
          )

          # Remove the temporary image-layer CSS; the board will use the validated real file directly.
          text, n_css = re.subn(
              r"\n    #gameApp \.arena-approved-bg\{.*?\n    \}\n",
              '\n', text, count=1, flags=re.S
          )

          # Remove the broken IMG injection from renderBoard.
          text, n_img = re.subn(
              r"\n    const arenaBg=document\.createElement\('img'\);arenaBg\.className='arena-approved-bg';arenaBg\.src=APPROVED_ARENA_IMAGE;arenaBg\.alt='';arenaBg\.setAttribute\('aria-hidden','true'\);els\.board\.appendChild\(arenaBg\);",
              '', text, count=1
          )

          marker = '/* ===== TFTMON EXACT APPROVED FLOATING ARENA — 2026-10-05 ===== */'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('Exact approved arena CSS marker not found')
          end = text.find('</style>', start)
          if end < 0:
              raise SystemExit('Style block end not found')
          block = text[start:end]
          old = 'background-image:none!important;'
          new = "background-image:url('assets/tftmon-arena-live.webp')!important;"
          if old not in block and new not in block:
              raise SystemExit('Arena background declaration not found in approved block')
          if old in block:
              block = block.replace(old, new, 1)
              text = text[:start] + block + text[end:]

          # Guard against reintroducing the broken truncated layer.
          if 'APPROVED_ARENA_IMAGE' in text or "arenaBg.className='arena-approved-bg'" in text:
              raise SystemExit('Broken embedded arena code still present after patch')

          path.write_text(text, encoding='utf-8')
          print('Removed embedded constant:', n_const)
          print('Removed embedded layer CSS:', n_css)
          print('Removed broken IMG injection:', n_img)
          PY

          git diff --check

      - name: Commit verified arena fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/tftmon-arena-live.webp
          git commit -m 'Restore verified complete approved arena asset' || exit 0
          git push origin HEAD:main
