name: Major preparation Pokemon boost

on:
  push:
    paths:
      - .github/workflows/preparation-pokemon-major-boost.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add final preparation-only Pokemon sizing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '/* ===== TFTMON MAJOR PREPARATION POKEMON BOOST ===== */'
          if marker in text:
              raise SystemExit('Major preparation boost already present')
          pos = text.rfind('</style>')
          if pos < 0:
              raise SystemExit('No closing style tag found')
          css = '''\n    /* ===== TFTMON MAJOR PREPARATION POKEMON BOOST ===== */\n    /* Final cascade override: preparation only. Combat fighters are untouched. */\n    #gameApp .board:not(.in-battle) .cell .token img{\n      width:132%!important;\n      height:124%!important;\n      max-width:none!important;\n      max-height:none!important;\n      object-fit:contain!important;\n      object-position:center bottom!important;\n      transform-origin:50% 88%!important;\n      transform:translateY(-12px) scale(var(--sprite-scale,1.18)) scale(1.75)!important;\n      filter:drop-shadow(0 9px 6px #000b)!important;\n    }\n    #gameApp .board:not(.in-battle) .enemy-preview-token{\n      overflow:visible!important;\n      z-index:8!important;\n    }\n    #gameApp .board:not(.in-battle) .enemy-preview-token img{\n      width:148%!important;\n      height:138%!important;\n      max-width:none!important;\n      max-height:none!important;\n      object-fit:contain!important;\n      object-position:center bottom!important;\n      transform-origin:50% 88%!important;\n      transform:translateY(-9px) scaleX(-1) scale(var(--sprite-scale,1.18)) scale(2.15)!important;\n      filter:drop-shadow(0 10px 7px #000c)!important;\n    }\n    #gameApp .board:not(.in-battle) .enemy-preview-token.boss-preview img{\n      transform:translateY(-9px) scaleX(-1) scale(var(--sprite-scale,1.18)) scale(1.85)!important;\n    }\n'''
          text = text[:pos] + css + text[pos:]
          path.write_text(text, encoding='utf-8')
          if marker not in path.read_text(encoding='utf-8'):
              raise SystemExit('Boost marker was not written')
          PY
          git diff --check
          git diff -- index.html

      - name: Commit boost
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Make preparation Pokemon much larger, especially opponents'
          git push origin HEAD:main
