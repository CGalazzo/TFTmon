name: Apply clean aligned arena

on:
  push:
    paths:
      - .github/workflows/apply-arena-v3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply clean arena
        run: bash scripts/apply-arena-v3.sh
